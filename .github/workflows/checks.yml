name: Scaffold checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/dev.py setup
      - run: python scripts/dev.py check
      - run: git diff --exit-code
